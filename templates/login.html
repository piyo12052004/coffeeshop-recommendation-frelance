<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body style="background:#f8f4f1;">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">

            <div class="card shadow border-0 p-4 rounded-4">

                <!-- HEADER -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold" style="color:#21150b;">
                        Welcome!
                    </h2>
                    <p style="color:#a89180;">Masuk ke akunmu</p>
                </div>

                <!-- ERROR -->
                {% if error %}
                <div class="alert alert-danger rounded-3" style="font-size:0.9rem;">
                    {{ error }}
                </div>
                {% endif %}

                <!-- TOMBOL GOOGLE -->
                <a href="/login/google"
                class="btn w-100 mb-3 fw-semibold d-flex align-items-center justify-content-center gap-2"
                style="border: 1.5px solid #ddd; background:white; color:#333; border-radius:10px; padding:10px;">
                    <img src="https://www.google.com/favicon.ico" width="18" height="18">
                    Masuk dengan Google
                </a>

                <!-- DIVIDER -->
                <div class="d-flex align-items-center mb-3">
                    <hr class="flex-grow-1">
                    <span class="mx-2" style="color:#a89180; font-size:0.85rem;">atau</span>
                    <hr class="flex-grow-1">
                </div>

                <!-- FORM LOGIN -->
                <form method="POST">

                    <div class="mb-3">
                        <label class="fw-semibold" style="color:#5C4033;">Email atau Username</label>
                        <input type="text" name="identifier" class="form-control rounded-3"
                               placeholder="Masukkan email atau username" required>
                    </div>

                    <div class="mb-3">
                        <label class="fw-semibold" style="color:#5C4033;">Password</label>
                        <div class="position-relative">
                            <input type="password" name="password" id="loginPassword"
                                   class="form-control rounded-3" required>
                            <i class="fa-regular fa-eye position-absolute"
                               id="toggleLoginPassword"
                               style="right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:#a89180;"></i>
                        </div>
                    </div>

                    <button class="btn fw-bold w-100 rounded-3"
                    style="background-color:#21150b; color:#ffffff; padding:10px;">
                        Login
                    </button>

                </form>

                <p class="text-center mt-3" style="color:#7a6757;">
                    Belum punya akun?
                    <a href="/register" style="color:#5C4033; font-weight:600;">Register</a>
                </p>

            </div>

        </div>
    </div>
</div>

<script>
    const toggleLoginPassword = document.getElementById('toggleLoginPassword');
    const loginPassword = document.getElementById('loginPassword');

    toggleLoginPassword.addEventListener('click', function () {
        const isPassword = loginPassword.getAttribute('type') === 'password';
        loginPassword.setAttribute('type', isPassword ? 'text' : 'password');
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });
</script>

</body>
</html>
